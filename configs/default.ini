# Lattice-unit parameters for a coalescence-induced jump with one hydrophilic particle.
# Values are conservative defaults for debugging; increase nx/ny/nz and maxIter for production.

[domain]
nx = 160
ny = 96
nz = 96
resolution = 160
periodicX = true
periodicY = true

[droplets]
radius = 22.0
centerX1 = 58.0
centerX2 = 102.0
centerY = 48.0
centerZ = 21.0
interfaceWidth = 4.0
initialBridge = 1.5
liquidDensity = 1.0
gasDensity = 0.02

[substrate]
# Superhydrophobic target; converted in the OpenLB case to free-energy h1/h2 signs.
contactAngleDeg = 165.0
wallMaterial = 2

[particle]
radius = 8.0
centerX = 80.0
centerY = 48.0
centerZ = 23.0
densityRatio = 1.8
contactAngleDeg = 35.0
dragCoefficient = 0.35
capillaryAdhesion = 0.18
restitution = 0.15

[freeEnergy]
alpha = 1.0
kappa1 = 0.005
kappa2 = 0.005
gamma = 10.0
relaxationTime = 1.0

[run]
maxIter = 70000
vtkIter = 500
statIter = 100
csvIter = 20
outputDir = ./tmp/droplet_particle_jump3d/
